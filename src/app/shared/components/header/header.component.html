<header class="homebar" [class.at-top]="!isScrolled" [class.scrolled]="isScrolled" [class.home-route]="isHomeRoute">
  <a class="logo-link" routerLink="/" aria-label="Lunar Lion Dance">
    <img class="logo-icon" src="assets/lld.ico"/>
  </a>

  <nav class="nav-links" aria-label="Primary">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/book" routerLinkActive="active">Book</a>
    <a routerLink="/contact" routerLinkActive="active">Contact</a>
  </nav>

  <div class="social-links">
    <a class="icon-link" [href]="instagramLink" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <img src="assets/icons/instagram.svg"/>
    </a>
    <a class="icon-link" [href]="facebookLink" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
      <img src="assets/icons/facebook.svg"/>
    </a>
    <a class="icon-link" [href]="emailLink" aria-label="Email">
      <img src="assets/icons/mail.svg"/>
    </a>
  </div>
</header>
